name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality · Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-groups --python 3.13; else uv sync --all-groups --python 3.13; fi
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

  compatibility:
    name: Compatibility · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-groups --python ${{ matrix.python-version }}; else uv sync --all-groups --python ${{ matrix.python-version }}; fi
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest
