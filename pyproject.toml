[project]
name = "saj-digital-nexus"
version = "1.0.0"
description = "Production-ready Flask website for SAJ Digital Nexus"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "flask==3.1.3",
  "gunicorn==26.1.0",
  "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saj_nexus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["saj_nexus"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "app.py:app"
